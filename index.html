<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тести">
<meta name="theme-color" content="#0a0a0a">
<title>Тести — Історія мистецтва</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #b91c1c;
    --good: #047857;
    --bad: #b91c1c;
    --border: #e5e3dd;
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04);
    --r: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  #app {
    max-width: 640px; margin: 0 auto; padding: 16px;
  }
  h1 { font-size: 22px; margin: 4px 0 16px; font-weight: 700; }
  h2 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  button {
    font: inherit; cursor: pointer; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 12px 14px; width: 100%; text-align: left;
    transition: background .12s, border-color .12s;
  }
  button:active { background: rgba(127,127,127,.08); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; text-align: center; }
  .opt { margin: 6px 0; }
  .opt button { display: flex; align-items: flex-start; gap: 10px; }
  .opt .letter {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    color: var(--muted);
  }
  .opt .label { flex: 1; }
  .opt.good button { border-color: var(--good); background: color-mix(in oklab, var(--good) 10%, var(--surface)); }
  .opt.good .letter { background: var(--good); color: white; border-color: var(--good); }
  .opt.bad button { border-color: var(--bad); background: color-mix(in oklab, var(--bad) 10%, var(--surface)); }
  .opt.bad .letter { background: var(--bad); color: white; border-color: var(--bad); }
  .opt button:disabled { opacity: 1; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
  }
  .progress {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    margin-bottom: 12px;
  }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .q-text { font-size: 17px; line-height: 1.4; margin: 0 0 14px; font-weight: 500; }
  .q-image {
    display: block; max-width: 100%; max-height: 360px; height: auto;
    margin: 0 auto 14px; border-radius: 8px; border: 1px solid var(--border);
  }
  .opt .opt-image {
    display: block; max-width: 100%; max-height: 180px; height: auto;
    border-radius: 6px; margin-top: 4px;
  }
  .feedback { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .feedback strong { color: var(--text); }
  .snippet {
    margin-top: 12px; padding: 12px 14px;
    background: var(--bg); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 14px; line-height: 1.5; color: var(--text);
  }
  .snippet .snippet-header {
    font-size: 11px; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  .snippet p { margin: 0; }
  .snippet strong { color: var(--text); }
  .section-pick { display: grid; gap: 8px; }
  .section-pick button { text-align: left; padding: 14px 16px; }
  .section-pick .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .section-block {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); overflow: hidden;
  }
  .section-block.open { box-shadow: var(--shadow); }
  .section-header { width: 100%; border: 0; border-radius: 0; padding: 14px 16px; background: transparent; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-title-row .chev { color: var(--muted); font-size: 14px; }
  .subsection-list {
    border-top: 1px solid var(--border); display: grid; gap: 1px;
    background: var(--border);
  }
  .sub-row {
    background: var(--surface); border: 0; border-radius: 0;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; font-size: 15px;
  }
  .sub-row .sub-title { flex: 1; min-width: 0; }
  .sub-row .sub-count {
    flex: 0 0 auto; color: var(--muted); font-size: 13px;
    background: var(--bg); padding: 2px 8px; border-radius: 999px;
  }
  .sub-row--all { background: color-mix(in oklab, var(--accent) 6%, var(--surface)); font-weight: 600; }
  .session-label {
    font-size: 13px; color: var(--muted); margin-bottom: 8px;
  }
  .summary-list { display: grid; gap: 10px; }
  .summary-item { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .summary-item.bad { border-color: color-mix(in oklab, var(--bad) 40%, var(--border)); }
  .summary-item .q { font-weight: 500; margin-bottom: 6px; }
  .summary-item .ans { font-size: 14px; color: var(--muted); }
  .summary-item .ans.you-good { color: var(--good); }
  .summary-item .ans.you-bad { color: var(--bad); }
  .ds-pick { display: grid; gap: 12px; }
  .ds-pick button { padding: 18px 16px; text-align: left; }
  .ds-pick .ds-title { font-weight: 600; font-size: 17px; margin-bottom: 4px; }
  .ds-pick .ds-sub { color: var(--muted); font-size: 14px; }
  .ds-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px;
  }
  .ds-bar .ds-current {
    flex: 1; font-size: 13px; color: var(--muted);
  }
  .ds-bar .ds-current strong { color: var(--text); }
  .ds-bar button {
    width: auto; padding: 6px 12px; font-size: 13px; border-radius: 999px;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin: 24px 0 8px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

const DATASETS = {
  konspekt: {
    label: "Конспект ЄФВВ",
    sublabel: "Питання за українським конспектом + реальні ЗНО",
    url: "quiz_data.json",
  },
  art: {
    label: "Art: The Whole Story",
    sublabel: "Питання за енциклопедією Farthing'а (експериментальна)",
    url: "art_data.json",
  },
};

const SESSION_SIZES = [10, 20, 30];
const LETTERS = ["А", "Б", "В", "Г", "Д", "Е"];
const DS_KEY = "quiz.dataset";

const app = document.getElementById("app");

let DATA = null;
let state = {
  view: "ds-pick",    // ds-pick | loading | home | session | summary
  dataset: null,      // "konspekt" | "art"
  scope: null,
  scopeLabel: "",
  expanded: new Set(),
  size: 15,
  pool: [],
  idx: 0,
  answers: [],
  error: null,
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dedupQuestions(qs) {
  const seen = new Set();
  return qs.filter(q => seen.has(q) ? false : (seen.add(q), true));
}

function getQuestions(scope) {
  if (scope.kind === "all") {
    const all = DATA.sections.flatMap(s =>
      s.subsections.flatMap(sub => sub.questions.map(q => ({...q, _section: s.title, _sub: sub.title})))
    );
    return dedupQuestions(all);
  }
  const sec = DATA.sections.find(s => s.id === scope.section);
  if (!sec) return [];
  if (scope.kind === "section") {
    return dedupQuestions(sec.subsections.flatMap(sub =>
      sub.questions.map(q => ({...q, _section: sec.title, _sub: sub.title}))
    ));
  }
  const sub = sec.subsections.find(s => s.id === scope.sub);
  return sub ? sub.questions.map(q => ({...q, _section: sec.title, _sub: sub.title})) : [];
}

function scopeLabelOf(scope) {
  if (scope.kind === "all") return "Усі розділи";
  const sec = DATA.sections.find(s => s.id === scope.section);
  if (!sec) return "";
  if (scope.kind === "section") return sec.title;
  const sub = sec.subsections.find(s => s.id === scope.sub);
  return sub ? sub.title : sec.title;
}

function startSession(scope, size) {
  const pool = shuffle(getQuestions(scope));
  state = {
    ...state,
    view: "session", scope, scopeLabel: scopeLabelOf(scope), size,
    pool: pool.slice(0, Math.min(size, pool.length)),
    idx: 0, answers: [],
  };
  render();
}

function answerQuestion(chosenIdx, shuffledOpts, correctShuffledIdx, shuffledImages) {
  const q = state.pool[state.idx];
  state.answers.push({
    q, chosen: chosenIdx, correct: correctShuffledIdx,
    shuffled: shuffledOpts, shuffledImages: shuffledImages || null,
  });
  render();
}

function nextQuestion() {
  state.idx += 1;
  if (state.idx >= state.pool.length) {
    state.view = "summary";
  }
  render();
}

function goHome() {
  state.view = "home";
  state.scope = null;
  state.pool = [];
  state.idx = 0;
  state.answers = [];
  render();
}

function pickDataset(id) {
  state.dataset = id;
  state.error = null;
  state.view = "loading";
  try { localStorage.setItem(DS_KEY, id); } catch (e) {}
  render();
  fetch(DATASETS[id].url, {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(json => { DATA = json; state.view = "home"; render(); })
    .catch(err => { state.error = String(err); state.view = "ds-pick"; render(); });
}

function changeDataset() {
  DATA = null;
  state.view = "ds-pick";
  state.scope = null; state.pool = []; state.idx = 0; state.answers = [];
  state.expanded = new Set();
  try { localStorage.removeItem(DS_KEY); } catch (e) {}
  render();
}

function sectionUniqueCount(s) {
  const seen = new Set();
  for (const sub of s.subsections) for (const q of sub.questions) seen.add(q);
  return seen.size;
}

function renderDsPick() {
  app.innerHTML = `
    <h1>Тести — Історія мистецтва</h1>
    <p class="muted">Обери джерело питань. Цей вибір можна змінити пізніше.</p>
    ${state.error ? `<div class="card" style="border-color:var(--bad);color:var(--bad);">Не вдалося завантажити дані: ${escapeHtml(state.error)}</div>` : ""}
    <div class="card">
      <div class="ds-pick">
        ${Object.entries(DATASETS).map(([id, ds]) => `
          <button data-ds="${id}">
            <div class="ds-title">${escapeHtml(ds.label)}</div>
            <div class="ds-sub">${escapeHtml(ds.sublabel)}</div>
          </button>
        `).join("")}
      </div>
    </div>
    <footer>Прогрес не зберігається між сесіями.</footer>
  `;
  app.querySelectorAll("[data-ds]").forEach(b => {
    b.onclick = () => pickDataset(b.dataset.ds);
  });
}

function renderLoading() {
  app.innerHTML = `
    <h1>Тести — Історія мистецтва</h1>
    <div class="card"><div class="muted">Завантажую питання…</div></div>
  `;
}

function renderHome() {
  const totalUnique = new Set();
  DATA.sections.forEach(s => s.subsections.forEach(sub => sub.questions.forEach(q => totalUnique.add(q))));
  const allCount = totalUnique.size;
  const dsLabel = DATASETS[state.dataset]?.label || "";

  app.innerHTML = `
    <div class="ds-bar">
      <div class="ds-current">Джерело: <strong>${escapeHtml(dsLabel)}</strong></div>
      <button id="change-ds">Змінити</button>
    </div>
    <h1>Тести — Історія мистецтва</h1>
    <p class="muted">Обери розділ, підрозділ і кількість питань. Питання та варіанти перемішуються щоразу.</p>

    <div class="card">
      <h2>Довжина сесії</h2>
      <div class="row" id="size-row">
        ${SESSION_SIZES.map(n => `
          <button data-size="${n}" class="${state.size === n ? "primary" : ""}">${n} питань</button>
        `).join("")}
      </div>
    </div>

    <div class="card">
      <h2>Що тренуємо</h2>
      <div class="section-pick">
        <button data-action="start-all">
          <div><strong>Усі розділи</strong></div>
          <div class="meta">${allCount} унікальних питань</div>
        </button>
        ${DATA.sections.map(s => {
          const count = sectionUniqueCount(s);
          const isOpen = state.expanded.has(s.id);
          return `
            <div class="section-block ${isOpen ? "open" : ""}">
              <button class="section-header" data-toggle="${s.id}">
                <div class="section-title-row">
                  <strong>${escapeHtml(s.title)}</strong>
                  <span class="chev">${isOpen ? "▾" : "▸"}</span>
                </div>
                <div class="meta">${count} питань · ${s.subsections.length} підрозділ(ів)</div>
              </button>
              ${isOpen ? `
                <div class="subsection-list">
                  <button data-action="start-section" data-section="${s.id}" class="sub-row sub-row--all">
                    <span class="sub-title">Увесь розділ</span>
                    <span class="sub-count">${count}</span>
                  </button>
                  ${s.subsections.map(sub => `
                    <button data-action="start-sub" data-section="${s.id}" data-sub="${sub.id}" class="sub-row">
                      <span class="sub-title">${escapeHtml(sub.title)}</span>
                      <span class="sub-count">${sub.questions.length}</span>
                    </button>
                  `).join("")}
                </div>
              ` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>

    <footer>Прогрес не зберігається між сесіями.</footer>
  `;
  document.getElementById("change-ds").onclick = changeDataset;
  app.querySelectorAll("[data-size]").forEach(b => {
    b.onclick = () => { state.size = parseInt(b.dataset.size, 10); render(); };
  });
  app.querySelectorAll("[data-toggle]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.toggle;
      if (state.expanded.has(id)) state.expanded.delete(id);
      else state.expanded.add(id);
      render();
    };
  });
  app.querySelectorAll('[data-action="start-all"]').forEach(b => {
    b.onclick = () => startSession({kind: "all"}, state.size);
  });
  app.querySelectorAll('[data-action="start-section"]').forEach(b => {
    b.onclick = () => startSession({kind: "section", section: b.dataset.section}, state.size);
  });
  app.querySelectorAll('[data-action="start-sub"]').forEach(b => {
    b.onclick = () => startSession({kind: "sub", section: b.dataset.section, sub: b.dataset.sub}, state.size);
  });
}

function renderSession() {
  const q = state.pool[state.idx];
  const lastAnswer = state.answers[state.answers.length - 1];
  const answered = lastAnswer && lastAnswer.q === q;

  let shuffled, correctIdx, shuffledImages;
  if (answered) {
    shuffled = lastAnswer.shuffled;
    correctIdx = lastAnswer.correct;
    shuffledImages = lastAnswer.shuffledImages || null;
  } else {
    const idxs = shuffle(q.options.map((_, i) => i));
    shuffled = idxs.map(i => q.options[i]);
    shuffledImages = q.option_images ? idxs.map(i => q.option_images[i]) : null;
    correctIdx = idxs.indexOf(q.correct);
    state._currentShuffle = { shuffled, correctIdx, shuffledImages };
  }
  if (!answered) ({ shuffled, correctIdx, shuffledImages } = state._currentShuffle);

  const progress = ((state.idx) / state.pool.length) * 100;
  const lesson = q.lesson ? `<span class="badge">${escapeHtml(q.lesson)}</span>` : "";
  const src = q.source === "ЗНО" ? `<span class="badge">ЗНО</span>` : "";

  app.innerHTML = `
    <div class="session-label">${escapeHtml(state.scopeLabel || "")}</div>
    <div class="progress"><div style="width:${progress}%"></div></div>
    <div class="muted" style="margin-bottom:8px;">${state.idx + 1} / ${state.pool.length} ${lesson} ${src}</div>

    <div class="card">
      <p class="q-text">${escapeHtml(q.q)}</p>
      ${q.q_images ? q.q_images.map(src => `
        <img class="q-image" src="${escapeHtml(src)}" alt="">
      `).join("") : ""}
      <div id="opts">
        ${shuffled.map((opt, i) => {
          let cls = "opt";
          if (answered) {
            if (i === correctIdx) cls += " good";
            else if (i === lastAnswer.chosen) cls += " bad";
          }
          const img = shuffledImages && shuffledImages[i]
            ? `<img class="opt-image" src="${escapeHtml(shuffledImages[i])}" alt="Варіант ${LETTERS[i]}">`
            : "";
          const label = opt
            ? `<span class="label">${escapeHtml(opt)}</span>`
            : (img ? "" : `<span class="label">(пусто)</span>`);
          return `
            <div class="${cls}">
              <button data-i="${i}" ${answered ? "disabled" : ""}>
                <span class="letter">${LETTERS[i]}</span>
                ${label}${img}
              </button>
            </div>
          `;
        }).join("")}
      </div>
      ${answered ? `
        <div class="feedback">
          ${lastAnswer.chosen === correctIdx
              ? `<strong style="color:var(--good)">Правильно.</strong>`
              : `<strong style="color:var(--bad)">Неправильно.</strong> Правильна відповідь: ${LETTERS[correctIdx]}.`}
          ${q.explain ? `<div style="margin-top:6px;">${escapeHtml(q.explain)}</div>` : ""}
        </div>
        ${lastAnswer.chosen !== correctIdx && q.snippet ? `
          <div class="snippet">
            <div class="snippet-header">${escapeHtml(snippetHeader(q.snippet))}</div>
            <p>${renderSnippet(q.snippet.text)}</p>
          </div>
        ` : ""}
      ` : ""}
    </div>

    ${answered ? `
      <button class="primary" id="next">
        ${state.idx + 1 < state.pool.length ? "Наступне питання" : "Завершити"}
      </button>
    ` : ""}
    <div style="margin-top:8px;">
      <button id="quit">Завершити сесію</button>
    </div>
  `;

  if (!answered) {
    app.querySelectorAll("#opts button").forEach(b => {
      b.onclick = () => {
        const chosen = parseInt(b.dataset.i, 10);
        answerQuestion(chosen, shuffled, correctIdx, shuffledImages);
      };
    });
  } else {
    document.getElementById("next").onclick = nextQuestion;
  }
  document.getElementById("quit").onclick = () => {
    state.view = "summary"; render();
  };
}

function snippetHeader(sn) {
  if (sn.chapter_title) return `Art: The Whole Story · ${sn.chapter_title}`;
  if (sn.lesson_id) return `З конспекту · ${sn.lesson_id}`;
  return "Джерело";
}

function renderSummary() {
  const total = state.answers.length;
  const right = state.answers.filter(a => a.chosen === a.correct).length;
  const pct = total ? Math.round((right / total) * 100) : 0;
  app.innerHTML = `
    <h1>Результат</h1>
    <div class="card" style="text-align:center;">
      <div style="font-size:48px; font-weight:700;">${right} / ${total}</div>
      <div class="muted">${pct}% правильно</div>
    </div>

    ${total > 0 ? `
      <div class="summary-list">
        ${state.answers.map((a, i) => {
          const isRight = a.chosen === a.correct;
          const renderOpt = (idx) => {
            const text = a.shuffled[idx];
            if (text) return escapeHtml(text);
            if (a.shuffledImages && a.shuffledImages[idx]) return `Варіант ${LETTERS[idx]} (зображення)`;
            return `Варіант ${LETTERS[idx]}`;
          };
          return `
            <div class="summary-item ${isRight ? "" : "bad"}">
              <div class="q">${i + 1}. ${escapeHtml(a.q.q)}</div>
              <div class="ans you-${isRight ? "good" : "bad"}">
                ${isRight ? "✓" : "✗"} Твоя відповідь: ${renderOpt(a.chosen)}
              </div>
              ${!isRight ? `<div class="ans you-good">✓ Правильна: ${renderOpt(a.correct)}</div>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    ` : ""}

    <div class="row" style="margin-top:16px;">
      <button class="primary" id="again">Нова сесія</button>
      <button id="home">На головну</button>
    </div>
  `;
  document.getElementById("again").onclick = () => startSession(state.scope, state.size);
  document.getElementById("home").onclick = goHome;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSnippet(s) {
  return escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function render() {
  if (state.view === "ds-pick") renderDsPick();
  else if (state.view === "loading") renderLoading();
  else if (state.view === "home") renderHome();
  else if (state.view === "session") renderSession();
  else if (state.view === "summary") renderSummary();
  window.scrollTo({top: 0, behavior: "instant"});
}

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlDs = urlParams.get("ds");
  let saved = null;
  try { saved = localStorage.getItem(DS_KEY); } catch (e) {}
  const preferred = (urlDs && DATASETS[urlDs]) ? urlDs : (saved && DATASETS[saved] ? saved : null);
  if (preferred) {
    pickDataset(preferred);
  } else {
    render();
  }
}

init();
</script>
</body>
